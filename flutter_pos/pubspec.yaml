name: commune_pos
description: "Commune Coffee Standalone Local-First POS Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2
  path_provider: ^2.1.4
  crypto: ^3.0.6
  flutter_classic_bluetooth: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/src/images/favicon.png
